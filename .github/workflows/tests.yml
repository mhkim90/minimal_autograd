name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Install and qualify CPU consumers
        run: |
          cmake --install build --prefix .scratch/install

          cmake -S tests/consumer/find_package -B .scratch/findpkg_build \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.scratch/install"
          cmake --build .scratch/findpkg_build --parallel
          .scratch/findpkg_build/autograd_smoke

          cmake -S tests/consumer/eigen_custom -B .scratch/eigen_custom_build \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.scratch/install"
          cmake --build .scratch/eigen_custom_build --parallel
          .scratch/eigen_custom_build/autograd_eigen_custom

          mkdir -p .scratch
          cp -r tests/consumer/add_subdir .scratch/addsub_consumer
          cmake -S .scratch/addsub_consumer -B .scratch/addsub_build \
            -DAUTOGRAD_SRC_DIR="$GITHUB_WORKSPACE"
          cmake --build .scratch/addsub_build --parallel
          .scratch/addsub_build/autograd_smoke
      - name: Build advanced tests
        run: |
          mkdir build-advanced && cd build-advanced
          cmake .. -DCMAKE_BUILD_TYPE=Release -DAUTOGRAD_BUILD_ADVANCED_OPS=ON
          make -j$(nproc)
      - name: Run advanced tests
        run: ctest --test-dir build-advanced --output-on-failure
